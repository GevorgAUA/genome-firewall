[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "genome-firewall"
version = "0.1.0"
description = "Interpretable and uncertainty-aware bacterial genome-to-antibiotic phenotype prediction research prototype."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Genome Firewall contributors" }]
dependencies = [
  "biopython>=1.83,<2",
  "fastapi>=0.115,<1",
  "joblib>=1.4,<2",
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pydantic>=2.8,<3",
  "python-multipart>=0.0.9,<1",
  "pyyaml>=6.0,<7",
  "rich>=13.7,<15",
  "scikit-learn>=1.4,<2",
  "scipy>=1.12,<2",
  "streamlit==1.36.0",
  "typer>=0.12,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1.11,<2",
  "pandas-stubs>=2.2,<3",
  "pre-commit>=3.7,<5",
  "pytest>=8.2,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.5,<1",
  "types-PyYAML>=6.0,<7",
]

[project.scripts]
genome-firewall = "genome_firewall.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/genome_firewall"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["genome_firewall"]

[tool.coverage.report]
fail_under = 80
show_missing = true
omit = [
  "src/genome_firewall/ui/*",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["genome_firewall"]
exclude = ["src/genome_firewall/ui/streamlit_app.py"]
